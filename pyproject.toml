[project]
name = "earshot"
version = "0.1.0"
description = "Earshot: listens to every fireground radio channel so no mayday goes unheard (Meta Model API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.50",
    "httpx>=0.27",
    "websockets>=13",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]

[project]
name = "fireline"
version = "0.1.0"
description = "AI indoor/outdoor coordination harness for firefighters: radio triage, hands-free briefing, unified world model (Meta Model API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.50",
    "httpx>=0.27",
    "websockets>=13",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fireline-demo = "fireline.demo:main"
fireline-server = "fireline.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fireline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

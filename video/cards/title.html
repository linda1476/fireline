<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#09090b;color:#fafafa;font-family:"Inter", "Malgun Gothic", "Pretendard", "Segoe UI", system-ui, sans-serif;-webkit-font-smoothing:antialiased}
.muted{color:#a1a1aa}
.rule{height:1px;background:#27272a;border:0}

.center{position:absolute;left:160px;right:160px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:88px;font-weight:700;letter-spacing:-1px}
.tag{font-size:40px;color:#d4d4d8;margin-top:28px;line-height:1.35}
.center .rule{width:720px;margin:56px 0 36px}
.labels{font-size:28px;color:#a1a1aa}
.chip{position:absolute;left:120px;bottom:100px;font-size:24px;color:#a1a1aa;border:1px solid #27272a;border-radius:999px;padding:12px 26px}

</style></head><body>

<div class="center">
  <h1>Earshot</h1>
  <div class="tag">listens to every fireground radio channel so no mayday goes unheard.</div>
  <div class="rule"></div>
  <div class="labels">Synthetic scenario · Korean radio · replay of a recorded live run · every model call was live</div>
</div>
<div class="chip">Meta Global AI Developer Hackathon 2026 · Build for Your World</div>

</body></html>

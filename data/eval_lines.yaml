  - {id: M04, lang: en, speaker_hint: en_engine21, expect: {tag: MAYDAY, distress_what: [TRAPPED, INJURY, FALL], unit: en_engine21, floor: null, codeword_masked: true, critical_terms: []},
     text: "Engine 21 to Command. I'm down, something fell on me, I can't move. Basement, Side Charlie. Send help."}

